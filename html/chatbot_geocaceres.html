<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHATBOT</title>
    <link rel="stylesheet" href="../css/chatbot_geocaceres.css">
    <link rel="icon" href="data:,">
</head>
<body>
    
    <h1>ASISTENTE GEOCÁCERES</h1>

    <div id="chat-container">

        <div id="header">
			<img src="../IMG/Logo_GeoCaceres.png" id="logo" alt="GeoCáceres">

			<div id="quick-actions">
				<button class="quick-btn" data-query="¿Qué puntos limpios hay cerca de mí?" title="¿Qué puntos limpios hay cerca de mí?">Punto Limpio</button>
				<button class="quick-btn" data-query="Busca farmacias cerca de mí" title="Busca farmacias cerca de mí">Farmacias</button>
				<button class="quick-btn" data-query="¿Qué autobuses puedo coger cerca de mí?" title="¿Qué autobuses puedo coger cerca de mí?">Autobuses</button>
				<button class="quick-btn" data-query="Dime Plazas de Movilidad Reducida cerca de mí" title="Dime Plazas de Movilidad Reducida cerca de mí">Movilidad Reducida</button>
				
			</div>
		</div>

        <div id="mensajes">
			<!-- <div class="mensaje-ia"></div> -->
			
        </div>

        <div id="input-area">
			<input id="usuario-input" type="text" placeholder="Escribe tu mensaje..."/>
			<button id="enviar-btn">Enviar</button>
		</div>

    </div>

    <script type="module" src="../js/main.js"></script>

</body>
</html>
